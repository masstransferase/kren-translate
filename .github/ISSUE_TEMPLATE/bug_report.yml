name: Bug report
description: Report a reproducible KREN defect using non-sensitive sample text.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never include API keys, confidential selected text, or credential-bearing logs. Revoke any exposed key immediately."
  - type: input
    id: version
    attributes:
      label: KREN and VS Code versions
      placeholder: "KREN 1.0.0; VS Code 1.xx.x"
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Operation
      options:
        - Grammar Check
        - English Dictionary
        - Synonyms
        - Korean Dictionary
        - Translation
        - Explain Meaning or Nuance
        - Rewrite English
        - Pronunciation or Read Aloud
        - Settings or panel UI
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use public or invented sample text only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed API keys, private text, filenames, paths, and other sensitive data.
          required: true
